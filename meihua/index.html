<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梅花易數排盤</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>🌸 梅花易數排盤</h1>
      <p class="sub">無故不占、不動不占 · 以《梅花易數》體用生剋、旺衰論斷，配《周易》卦辭爻辭</p>
      <nav class="topnav">
        <button type="button" id="btn-prefs">顯示項目</button>
        <button type="button" id="btn-history">歷史紀錄</button>
        <button type="button" id="btn-account" hidden>帳號</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- 顯示項目 -->
    <section class="card" id="panel-prefs" hidden>
      <h2>顯示項目</h2>
      <p class="muted">勾選要在結果中顯示的內容，選擇會記在這個瀏覽器。</p>
      <div class="checks" id="prefs-checks"></div>
      <div class="row">
        <label>月令算法
          <select id="pref-monthMode">
            <option value="solar">依節氣（立春換寅月，預設）</option>
            <option value="lunar">依農曆月份（正月建寅）</option>
          </select>
        </label>
        <label class="inline"><input type="checkbox" id="pref-autosave"> 起卦後自動存入歷史紀錄</label>
      </div>
    </section>

    <!-- 起卦 -->
    <section class="card">
      <h2>起卦</h2>
      <div class="row">
        <label class="grow">占問事由
          <input id="question" type="text" maxlength="100" placeholder="例如：明日面試是否順利？">
        </label>
        <label>類別
          <select id="category">
            <option>事業</option><option>財運</option><option>感情</option><option>健康</option>
            <option>出行</option><option>學業</option><option>其他</option>
          </select>
        </label>
      </div>

      <div class="tabs" role="tablist" id="method-tabs"></div>
      <div id="method-form"></div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <button type="button" id="btn-cast" class="primary">開始起卦</button>
    </section>

    <!-- 結果 -->
    <div id="result" aria-live="polite"></div>

    <!-- 歷史 -->
    <section class="card" id="panel-history" hidden>
      <h2>歷史紀錄</h2>
      <div class="row">
        <button type="button" id="hist-export">匯出 JSON</button>
        <button type="button" id="hist-clear" class="danger">清空本機紀錄</button>
        <button type="button" id="hist-upload" hidden>上傳本機紀錄到雲端</button>
        <span class="muted" id="hist-source"></span>
      </div>
      <ul class="history" id="history-list"></ul>
    </section>

    <!-- 帳號（Supabase，可選） -->
    <section class="card" id="panel-account" hidden>
      <h2>帳號與雲端同步</h2>
      <div id="account-body"></div>
    </section>
  </main>

  <footer class="wrap muted foot">
    <p>斷語為依原書體用、旺衰規則所做的簡化推算，僅供娛樂與自我反思，不構成任何決策建議。</p>
    <p>經文：傅佩榮《傅佩榮易經課》解卦手冊中的《周易》原文；規則：邵雍《梅花易數》（陳明點校）。</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/data-zhouyi.js"></script>
  <script src="js/data-meihua.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
