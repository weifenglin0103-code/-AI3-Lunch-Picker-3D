# 把 meihua/ 資料夾發佈成靜態網站（GitHub Pages）。
# 使用前：到 GitHub 專案 Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
# 觸發：推送到 main 且 meihua/ 有變動，或在 Actions 頁手動執行。
name: Deploy meihua to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["meihua/**", ".github/workflows/meihua-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test meihua/tests/core.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meihua
      - id: deployment
        uses: actions/deploy-pages@v4
